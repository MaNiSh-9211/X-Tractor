<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Text Extractor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6fb; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); padding: 32px; }
        h1 { text-align: center; color: #4f46e5; margin-bottom: 24px; }
        .form { text-align: center; margin-bottom: 24px; }
        .file-input { margin-bottom: 16px; }
        .submit-btn { background: #4f46e5; color: #fff; border: none; padding: 12px 32px; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        .submit-btn:hover { background: #3730a3; }
        .result-box { background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 8px; padding: 18px; margin-top: 18px; font-family: 'Courier New', monospace; white-space: pre-wrap; }
        .error { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OCR Text Extractor</h1>
        <form method="post" enctype="multipart/form-data" class="form">
            {% csrf_token %}
            <input type="file" name="image" class="file-input" accept="image/*" required><br>
            <button type="submit" class="submit-btn">Extract Text</button>
        </form>
        {% if extracted_text %}
        <div class="result-box">{{ extracted_text }}</div>
        {% endif %}
        {% if error_message %}
        <div class="result-box error">{{ error_message }}</div>
        {% endif %}
    </div>
</body>
</html>
